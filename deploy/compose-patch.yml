# ── Добавить ОДНУ строку в секцию volumes сервиса caddy ──
# в /home/workaem/deploy/docker-compose.yml

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./junior-way:/srv/junior-way:ro     # ← ВОТ ЭТА СТРОКА
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, rest, auth, storage]
